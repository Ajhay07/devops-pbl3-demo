apiVersion: apps/v1
kind: Deployment
metadata:
  name: pbl3-demo-blue
  labels:
    app: pbl3-demo-app
    version: blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pbl3-demo-app
      version: blue
  template:
    metadata:
      labels:
        app: pbl3-demo-app
        version: blue
    spec:
      containers:
        - name: pbl3-demo-app
          image: ajhay07/pbl3-demo-app:2
          env:
            - name: APP_VERSION
              value: "blue"
          ports:
            - containerPort: 5000
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
